name: Apply news and rates from the hourly Claude run

# The hourly Claude run pushes its updated data files to a new claude/data-<time> branch
# (or the older fixed claude/data branch). This job checks them, copies only those four
# files into main, publishes, then deletes the run's branch so the next run starts clean.
on:
  push:
    branches: ['claude/data', 'claude/data-*']

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-data
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copy the data files from the run's branch and check them
        id: copy
        run: |
          git fetch -q origin "$BRANCH"
          git checkout FETCH_HEAD -- data/news.json data/brokers.json data/status.json data/changes.json
          python3 scripts/update_data.py validate
          git config user.name "iashuhere"
          git config user.email "iashuhere@users.noreply.github.com"
          git add data/news.json data/brokers.json data/status.json data/changes.json
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          echo "changed=$(git diff --cached --name-only | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          git commit -q -m "data: $(git log -1 --format=%s FETCH_HEAD)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Publish the site
        if: steps.copy.outputs.changed != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main -f changed="${{ steps.copy.outputs.changed }}"
      - name: Delete the run's branch
        if: success() && startsWith(github.ref_name, 'claude/data-')
        run: git push -q origin --delete "$BRANCH" || true
